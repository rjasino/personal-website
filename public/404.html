<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111214" />
    <title>Page not found — Roberto Asino</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, 'Inter Tight', Arial, sans-serif;
        color: #f0ece4;
        background: #111214;
      }
      * { box-sizing: border-box; }
      body {
        display: grid;
        min-width: 320px;
        min-height: 100vh;
        place-items: center;
        margin: 0;
        padding: 1.5rem;
        background-image: linear-gradient(#26282b 1px, transparent 1px), linear-gradient(90deg, #26282b 1px, transparent 1px);
        background-size: 4.5rem 4.5rem;
      }
      main { width: min(100%, 42rem); }
      .brand, .eyebrow, a {
        font-family: 'JetBrains Mono', Consolas, monospace;
      }
      .brand { color: #f5a524; font-size: 0.9rem; }
      .eyebrow { margin-top: 4rem; color: #f5a524; font-size: 0.8rem; letter-spacing: 0.14em; }
      h1 {
        margin: 0.75rem 0;
        font-family: 'Space Grotesk', Inter, Arial, sans-serif;
        font-size: clamp(3.25rem, 12vw, 6rem);
        letter-spacing: -0.06em;
        line-height: 0.98;
      }
      p { color: #b1b2b7; font-size: 1.1rem; line-height: 1.6; }
      a { display: inline-block; margin-top: 1rem; color: #f5a524; text-underline-offset: 0.25em; }
      a:focus-visible { outline: 3px solid #f5a524; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <div aria-label="Roberto Asino home" class="brand">~/rjasino</div>
      <p class="eyebrow">404 / NOT FOUND</p>
      <h1>Page not found</h1>
      <p>This address doesn’t lead to a portfolio page. Head back to the home page to find your way.</p>
      <a href="__PAGES_BASE_PATH__">← Return home</a>
    </main>
  </body>
</html>
